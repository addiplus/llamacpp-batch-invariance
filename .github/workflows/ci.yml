name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Zero-GPU: the whole suite runs against the in-repo mock llama-server, so it
# needs no model weights and no accelerator. CUDA_VISIBLE_DEVICES="" makes that
# explicit (and guards against a runner that happens to expose a GPU).
jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (runtime is stdlib-only; dev extras = pytest + ruff)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (zero-GPU, mock-only)
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: pytest -q
